name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional helper development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Check native plugin layout without third-party imports
        run: python -I skills/doctor/scripts/doctor.py
      - name: Check dependencies
        run: python -m pip check
      - name: Verify generated schemas
        run: |
          python scripts/export_schemas.py
          git diff --exit-code -- schemas
      - name: Package native plugin
        run: python scripts/package_plugin.py
      - name: Check publishable content
        run: python scripts/check_release.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.6.1
      - name: Build optional Python distributions
        run: python scripts/build_release.py
